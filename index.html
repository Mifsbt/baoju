<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深海寻宝 - 抽卡模拟器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #0a2a4a 0%, #0d3d6b 30%, #1a5c8a 60%, #2a7aaa 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
  }

  .scene {
    width: 100%;
    max-width: 800px;
    height: 100vh;
    max-height: 700px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    transform: scale(1.5);
    transform-origin: top center;
  }

  /* 气泡背景 */
  .ocean-bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), rgba(100,200,255,0.1));
    border-radius: 50%;
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }
  .bubble:nth-child(1) { width: 20px; height: 20px; left: 5%; animation-duration: 8s; }
  .bubble:nth-child(2) { width: 15px; height: 15px; left: 15%; animation-duration: 10s; animation-delay: 1s; }
  .bubble:nth-child(3) { width: 25px; height: 25px; left: 25%; animation-duration: 7s; animation-delay: 2s; }
  .bubble:nth-child(4) { width: 12px; height: 12px; left: 40%; animation-duration: 9s; animation-delay: 0.5s; }
  .bubble:nth-child(5) { width: 18px; height: 18px; left: 55%; animation-duration: 11s; animation-delay: 3s; }
  .bubble:nth-child(6) { width: 22px; height: 22px; left: 70%; animation-duration: 8.5s; animation-delay: 1.5s; }
  .bubble:nth-child(7) { width: 14px; height: 14px; left: 85%; animation-duration: 9.5s; animation-delay: 2.5s; }
  .bubble:nth-child(8) { width: 16px; height: 16px; left: 92%; animation-duration: 10.5s; animation-delay: 0.8s; }

  /* 顶部标题 */
  .top-banner {
    background: linear-gradient(90deg, transparent, rgba(0,100,180,0.8), transparent);
    padding: 12px 40px 8px;
    border-radius: 20px;
    color: #fff;
    font-size: 14px;
    margin-bottom: 15px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    z-index: 10;
    position: relative;
    text-align: center;
  }
  .up-items {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 6px;
  }
  .up-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .up-item img {
    width: 43px;
    height: 43px;
    object-fit: contain;
    filter: drop-shadow(0 0 6px rgba(255,200,50,0.6));
  }
  .up-item .up-name {
    font-size: 13px;
    color: #f0d060;
    text-shadow: 0 0 6px rgba(240,208,96,0.4);
  }

  /* 主体区域 - 正方形网格 */
  .main-area {
    position: relative;
    width: 420px;
    height: 336px;
    transform: scale(0.9);
    transform-origin: top center;
    z-index: 10;
  }

  /* 幸运值中心 */
  .luck-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 140px;
    height: 140px;
    z-index: 20;
    text-align: center;
  }
  .luck-ring {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, #b8e6ff 0%, #87ceeb 40%, #5ba3d9 80%, #4a8ab8 100%);
    border: 6px solid #a0d8f0;
    box-shadow: 0 0 30px rgba(100,200,255,0.5), inset 0 0 20px rgba(255,255,255,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .luck-number {
    font-size: 48px;
    font-weight: bold;
    color: #1a6090;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    line-height: 1;
  }
  .luck-label {
    font-size: 16px;
    color: #2a80b0;
    margin-top: 2px;
  }

  /* ===== 道具格子 ===== */
  .item {
    position: absolute;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 10;
  }
  .item:hover {
    transform: scale(1.1);
    z-index: 30;
  }

  /* 底色层 */
  .item-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }
  /* 边框层 */
  .item-frame {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    z-index: 3;
  }
  /* 图标层 */
  .item .icon {
    width: 62px;
    height: 62px;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    position: relative;
    z-index: 2;
  }
  /* 数量角标 */
  .item .qty {
    position: absolute;
    bottom: 0;
    right: 4px;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    z-index: 4;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
  }
  /* 概率标签 */
  .item .prob-badge {
    position: absolute;
    bottom: 2px;
    right: 0px;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    z-index: 4;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
  }
  /* 图标层 */
  .item .icon {
    width: 62px;
    height: 62px;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    position: relative;
    z-index: 2;
  }
  /* 数量角标 */
  .item .qty {
    position: absolute;
    bottom: 0;
    right: 0;
    color: #fff;
    font-size: 17px;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: bold;
    z-index: 3;
  }
  /* 概率标签 */
  .item .prob-badge {
    position: absolute;
    bottom: 0;
    left: 38px;
    color: #fff;
    font-size: 15px;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: bold;
    z-index: 3;
  }

  /* 稀有度底色 */
  .rarity-N .item-bg  { background-image: url('奖池/UI/Common_ItemQuality_SquareBg_N.png'); }
  .rarity-R .item-bg  { background-image: url('奖池/UI/Common_ItemQuality_SquareBg_R.png'); }
  .rarity-SR .item-bg { background-image: url('奖池/UI/Common_ItemQuality_SquareBg_SR.png'); }
  .rarity-SSR .item-bg { background-image: url('奖池/UI/Common_ItemQuality_SquareBg_SSR.png'); }
  /* 稀有度边框 */
  .rarity-N .item-frame  { background-image: url('奖池/UI/Common_ItemQuality_SquareFrame_N.png'); }
  .rarity-R .item-frame  { background-image: url('奖池/UI/Common_ItemQuality_SquareFrame_R.png'); }
  .rarity-SR .item-frame { background-image: url('奖池/UI/Common_ItemQuality_SquareFrame_SR.png'); }
  .rarity-SSR .item-frame { background-image: url('奖池/UI/Common_ItemQuality_SquareFrame_SSR.png'); }

  /* 抽卡高亮 */
  .item.highlight-anim {
    animation: itemGlow 0.5s ease-in-out;
  }
  @keyframes itemGlow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.6) drop-shadow(0 0 12px rgba(255,255,100,0.8)); }
  }

  /* 保底提示 */
  .pity-info {
    background: linear-gradient(90deg, transparent, rgba(0,80,140,0.7), transparent);
    padding: 6px 30px;
    border-radius: 15px;
    color: #90d0ff;
    font-size: 13px;
    margin-top: 10px;
    z-index: 10;
    position: relative;
    text-align: center;
  }
  .pity-info .highlight { color: #ffcc00; font-weight: bold; }

  /* 底部按钮区 */
  .bottom-area {
    display: flex;
    gap: 20px;
    margin-top: 15px;
    z-index: 10;
    position: relative;
    align-items: center;
  }
  .pull-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    border: none;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
  .pull-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
  .pull-btn:active { transform: translateY(0); }
  .pull-btn .cost-icon { font-size: 22px; }
  .pull-btn .cost-num { font-size: 14px; opacity: 0.9; }
  .pull-1 { background: linear-gradient(135deg, #5dade2, #2980b9); box-shadow: 0 4px 15px rgba(41,128,185,0.4); }
  .pull-5 { background: linear-gradient(135deg, #e67e22, #d35400); box-shadow: 0 4px 15px rgba(211,84,0,0.4); }

  /* 抽卡记录 */
  .history-panel {
    position: fixed;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    width: 520px;
    max-height: 520px;
    background: rgba(0,20,40,0.7);
    border: 1px solid rgba(100,200,255,0.2);
    border-radius: 10px;
    padding: 10px;
    z-index: 100;
    overflow-y: auto;
  }
  .history-panel::-webkit-scrollbar { width: 4px; }
  .history-panel::-webkit-scrollbar-thumb { background: rgba(100,200,255,0.3); border-radius: 2px; }
  .history-title {
    color: #a0d8ff;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 8px;
    text-align: center;
    border-bottom: 1px solid rgba(100,200,255,0.15);
    padding-bottom: 6px;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .history-entry {
    color: #c0e0ff;
    font-size: 220px;
    padding: 5px 6px;
    background: rgba(255,255,255,0.03);
    border-radius: 4px;
  }
  .history-entry .h-time {
    color: #80c0ff;
    font-size: 20px;
    display: block;
    margin-bottom: 3px;
  }
  .history-entry .h-items {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }
  .history-entry .h-items img {
    width: 44px;
    height: 44px;
    object-fit: contain;
  }

  /* 结果弹窗 */
  .result-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .result-overlay.show { opacity: 1; pointer-events: all; }
  .result-box {
    background: linear-gradient(135deg, #1a4a6a, #0d3050);
    border: 3px solid #4a9ac0;
    border-radius: 20px;
    padding: 30px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    box-shadow: 0 0 50px rgba(74,154,192,0.5);
  }
  .result-title { font-size: 22px; color: #f0d060; margin-bottom: 20px; text-shadow: 0 0 10px rgba(240,208,96,0.5); }
  .result-items { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 20px; }

  /* 结果格子 */
  .result-item {
    width: 76px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: popIn 0.4s ease-out both;
  }
  .result-item .item-bg,
  .result-item .item-frame {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }
  .result-item .item-frame { z-index: 3; }
  .result-item .icon { width: 62px; height: 62px; object-fit: contain; position: relative; z-index: 2; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
  .result-item .qty {
    position: absolute;
    bottom: 2px; right: 2px;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    z-index: 4;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }

  .result-close {
    background: linear-gradient(135deg, #5dade2, #2980b9);
    border: none;
    color: #fff;
    padding: 10px 40px;
    border-radius: 20px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s;
  }
  .result-close:hover { transform: scale(1.05); }

  /* 资源/统计 */
  .currency {
    position: fixed;
    top: 15px;
    right: 20px;
    display: flex;
    gap: 15px;
    z-index: 100;
  }
  .currency-item {
    background: rgba(0,0,0,0.4);
    padding: 6px 14px;
    border-radius: 15px;
    color: #fff;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .currency-item .c-icon { font-size: 18px; }

  .stats {
    position: fixed;
    top: 22px;
    left: 22px;
    background: rgba(0,0,0,0.4);
    padding: 8px 14px;
    border-radius: 10px;
    color: #a0d0f0;
    font-size: 12px;
    z-index: 100;
    line-height: 1.6;
    transform: scale(1.5);
    transform-origin: top left;
  }

  /* 深海珍藏奖品（左下角） */
  .deepsea-stat {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(0,0,0,0.5);
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,200,50,0.25);
    z-index: 100;
    box-shadow: 0 0 12px rgba(255,200,50,0.1);
    transform: scale(2);
    transform-origin: bottom left;
  }
  .deepsea-stat-title {
    color: #f0d060;
    font-size: 11px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 4px;
    text-shadow: 0 0 6px rgba(240,208,96,0.3);
  }
  .deepsea-stat-items {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    max-height: 160px;
    overflow-y: auto;
  }
  .deepsea-stat-items::-webkit-scrollbar { width: 3px; }
  .deepsea-stat-items::-webkit-scrollbar-thumb { background: rgba(255,200,50,0.2); border-radius: 2px; }
  .deepsea-stat-items img {
    width: 32px;
    height: 32px;
    object-fit: contain;
    border-radius: 3px;
    background: rgba(0,0,0,0.3);
    filter: drop-shadow(0 0 3px rgba(255,200,50,0.2));
  }
  .backpack-item {
    position: relative;
    display: inline-block;
  }
  .backpack-count {
    position: absolute;
    bottom: 0;
    right: 0;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 9px;
    line-height: 1;
    padding: 1px 3px;
    border-radius: 3px;
    font-weight: bold;
  }

  /* 概率面板 */
  .prob-panel {
    position: fixed;
    top: 50%;
    left: 10px;
    transform: translateY(-50%) scale(1);
    transform-origin: left center;
    width: 270px;
    max-height: 590px;
    background: rgba(0,20,40,0.75);
    border: 1px solid rgba(100,200,255,0.15);
    border-radius: 8px;
    padding: 8px 10px;
    z-index: 100;
    overflow-y: auto;
  }
  .prob-panel::-webkit-scrollbar { width: 3px; }
  .prob-panel::-webkit-scrollbar-thumb { background: rgba(100,200,255,0.25); border-radius: 2px; }
  .prob-title {
    color: #90c8e8;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    border-bottom: 1px solid rgba(100,200,255,0.12);
    padding-bottom: 4px;
    margin-bottom: 6px;
  }
  .prob-group { margin-bottom: 4px; }
  .prob-group-name {
    display: flex;
    justify-content: space-between;
    color: #c0e0ff;
    font-size: 12px;
    padding: 1px 2px;
  }
  .prob-group-name .prob-pct { color: #f0d060; }
  .prob-sub {
    font-size: 10px;
    color: #80b0d0;
    padding-left: 10px;
    line-height: 1.6;
  }

  /* 深海珍藏开箱 */
  .chest-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .chest-overlay.show { opacity: 1; pointer-events: all; }
  .chest-box {
    text-align: center;
    cursor: pointer;
    animation: chestPulse 1.2s ease-in-out infinite;
  }
  @keyframes chestPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .chest-icon {
    width: 180px;
    height: 180px;
    margin: 0 auto;
    background: url('奖池/JP/Property_GachaChest.png') center/contain no-repeat;
    filter: drop-shadow(0 0 40px rgba(255,200,50,0.6));
  }
  .chest-hint {
    color: #f0d060;
    font-size: 24px;
    margin-top: 20px;
    text-shadow: 0 0 10px rgba(240,208,96,0.5);
    animation: hintBlink 1s ease-in-out infinite;
  }
  @keyframes hintBlink {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* 开箱揭示 */
  .chest-reveal {
    text-align: center;
  }
  @keyframes revealPop {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .chest-reveal .reveal-icon {
    width: 160px;
    height: 160px;
    margin: 0 auto;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    cursor: pointer;
  }
  .chest-reveal .reveal-name {
    color: #fff;
    font-size: 26px;
    margin-top: 12px;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  }
  .chest-reveal .reveal-qty {
    color: #f0d060;
    font-size: 18px;
    margin-top: 4px;
  }
  .chest-reveal .reveal-continue {
    color: #80c0e0;
    font-size: 16px;
    margin-top: 16px;
    animation: hintBlink 1s ease-in-out infinite;
  }

  /* 浮字 */
  .float-text {
    position: fixed;
    color: #f0d060;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(240,208,96,0.8), 0 2px 4px rgba(0,0,0,0.5);
    pointer-events: none;
    z-index: 1001;
    animation: floatUp 1.5s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
  }
</style>
</head>
<body>

<div class="ocean-bg">
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="bubble"></div><div class="bubble"></div>
</div>

<div class="stats">
  <div>已消耗号角: <span id="totalSpent">0</span></div>
  <div>已获得山铜: <span id="shantongCount">0</span></div>
  <div>已获得深海珍藏: <span id="deepSeaCount">0</span></div>
  <div>已获得传说宝具: <span id="legendaryCount">0</span></div>
</div>

<div class="deepsea-stat">
  <div class="deepsea-stat-title">背包</div>
  <div class="deepsea-stat-items" id="deepSeaItems"></div>
</div>

<div class="prob-panel">
  <div class="prob-title">概率</div>
  <div class="prob-list" id="probList"></div>
</div>

<div class="scene">
  <div class="top-banner">
    <div class="up-items">
      <div class="up-item"><img src="奖池/深海珍藏/UP/埃癸斯之盾.png"><span class="up-name">埃癸斯之盾</span></div>

<script>
const ITEMS = [
  { id: 1,  name: '深海珍藏',   icon: '奖池/JP/Property_GachaChest.png', rarity: 'SSR' },
  { id: 2,  name: '随机洗练石',   icon: '奖池/JP/itemicon_20101.png',      rarity: 'R' },
  { id: 3,  name: '原生琥珀',   icon: '奖池/JP/itemicon_1021.png',        rarity: 'SR' },
  { id: 4,  name: '随机史诗宝具',   icon: '奖池/JP/itemicon_1751.png',       rarity: 'SR' },

  { id: 8,  name: '普通珊瑚',   icon: '奖池/JP/itemicon_850001.png',     rarity: 'N' },

  { id: 10, name: '神辉碎片',   icon: '奖池/JP/itemicon_61.png',          rarity: 'SR' },
  { id: 11, name: '随机精英宝具', icon: '奖池/JP/itemicon_1750.png',      rarity: 'R' },
  { id: 12, name: '命运号角',   icon: '奖池/JP/itemicon_NormalGacha_02.png', rarity: 'SR' },
  { id: 13, name: '精美珊瑚',   icon: '奖池/JP/itemicon_850003.png',      rarity: 'SR' },
  { id: 14, name: '随机传说宝具', icon: '奖池/JP/itemicon_1752.png',      rarity: 'SR' },
];

// 概率池（按用户给定的百分比换算为权重）
const ROLL_POOL = [
  { id: 1,  qty: 1,  weight: 500 },    // 深海珍藏 0.5001% (UP 0.0833%×3 + 普通 0.0139%×18)
  { id: 2,  qty: 10, weight: 2000 },   // 随机洗练石 2%
  { id: 3,  qty: 15, weight: 250 },    // 原生琥珀 x15 0.25%
  { id: 3,  qty: 5,  weight: 750 },    // 原生琥珀 x5  0.75%
  { id: 3,  qty: 3,  weight: 1500 },   // 原生琥珀 x3  1.5%
  { id: 4,  qty: 1,  weight: 8000 },   // 随机史诗宝具 8%
  { id: 5,  qty: 2,  weight: 2500 },   // 山铜 2.5%
  { id: 6,  qty: 1,  weight: 1500 },   // 命运魔药 1.5%
  { id: 7,  qty: 10, weight: 12000 },  // 优良珊瑚 12%
  { id: 8,  qty: 25, weight: 33000 },  // 普通珊瑚 33%
  { id: 9,  qty: 1,  weight: 4500 },   // 命运龙晶 4.5%
  { id: 10, qty: 15, weight: 500 },    // 神辉碎片 x15 0.5%
  { id: 10, qty: 5,  weight: 1500 },   // 神辉碎片 x5  1.5%
  { id: 10, qty: 3,  weight: 3000 },   // 神辉碎片 x3  3%
  { id: 11, qty: 1,  weight: 21000 },  // 随机精英宝具 21%
  { id: 12, qty: 1,  weight: 1500 },   // 命运号角 1.5%
  { id: 13, qty: 5,  weight: 4000 },   // 精美珊瑚 4%
  { id: 14, qty: 1,  weight: 2000 },   // 随机传说宝具 2%
];

// 深海珍藏奖池
const DEEP_SEA_TREASURE = [
  { id: 'dt1', name: '夜谭神灯', icon: '奖池/深海珍藏/夜谭神灯.png', rarity: 'SSR', weight: 1 },
  { id: 'dt2', name: '叛逆之刃', icon: '奖池/深海珍藏/叛逆之刃.png', rarity: 'SSR', weight: 1 },
  { id: 'dt3', name: '灵液血瓶', icon: '奖池/深海珍藏/灵液血瓶.png', rarity: 'SSR', weight: 1 },
  { id: 'dt4', name: '女神侧身像', icon: '奖池/深海珍藏/女神侧身像.png', rarity: 'SSR', weight: 1 },
  { id: 'dt5', name: '断钢剑鞘', icon: '奖池/深海珍藏/断钢剑鞘.png', rarity: 'SSR', weight: 1 },
  { id: 'dt6', name: '青玉龙玺', icon: '奖池/深海珍藏/青玉龙玺.png', rarity: 'SSR', weight: 1 },
  { id: 'dt7', name: '龙息大剑', icon: '奖池/深海珍藏/龙息大剑.png', rarity: 'SSR', weight: 1 },
  { id: 'dt8', name: '巫妖魂匣', icon: '奖池/深海珍藏/巫妖魂匣.png', rarity: 'SSR', weight: 1 },
  { id: 'dt9', name: '裁决巨斧', icon: '奖池/深海珍藏/裁决巨斧.png', rarity: 'SSR', weight: 1 },
  { id: 'dt10', name: '暗鸦之翎', icon: '奖池/深海珍藏/暗鸦之翎.png', rarity: 'SSR', weight: 1 },
  { id: 'dt11', name: '审判号角', icon: '奖池/深海珍藏/审判号角.png', rarity: 'SSR', weight: 1 },
  { id: 'dt12', name: '瓶中小人', icon: '奖池/深海珍藏/瓶中小人.png', rarity: 'SSR', weight: 1 },
  { id: 'dt13', name: '斩裂魔锋', icon: '奖池/深海珍藏/斩裂魔锋.png', rarity: 'SSR', weight: 1 },
  { id: 'dt14', name: '蛇神战刃', icon: '奖池/深海珍藏/蛇神战刃.png', rarity: 'SSR', weight: 1 },
  { id: 'dt15', name: '贯日剑匣', icon: '奖池/深海珍藏/贯日剑匣.png', rarity: 'SSR', weight: 1 },
  { id: 'dt16', name: '环界魔刃', icon: '奖池/深海珍藏/环界魔刃.png', rarity: 'SSR', weight: 1 },
  { id: 'dt17', name: '火焰魔壶', icon: '奖池/深海珍藏/火焰魔壶.png', rarity: 'SSR', weight: 1 },
  { id: 'dt18', name: '湖女圣剑', icon: '奖池/深海珍藏/湖女圣剑.png', rarity: 'SSR', weight: 1 },
  { id: 'up1', name: '埃癸斯之盾', icon: '奖池/深海珍藏/UP/埃癸斯之盾.png', rarity: 'SSR', weight: 6 },
  { id: 'up2', name: '耀阳神弓', icon: '奖池/深海珍藏/UP/耀阳神弓.png', rarity: 'SSR', weight: 6 },
  { id: 'up3', name: '叹息之枪', icon: '奖池/深海珍藏/UP/叹息之枪.png', rarity: 'SSR', weight: 6 },
];

function rollDeepSeaTreasure() {
  const total = DEEP_SEA_TREASURE.reduce((s, i) => s + i.weight, 0);
  let r = Math.random() * total;
  for (const item of DEEP_SEA_TREASURE) {
    r -= item.weight;
    if (r <= 0) return { ...item };
  }
  return { ...DEEP_SEA_TREASURE[DEEP_SEA_TREASURE.length - 1] };
}

const LEGENDARY_TREASURE = [
  { id: 'lt1',  name: '855001', icon: '奖池/传说宝具/Property_855001_custom.png', rarity: 'SR' },
  { id: 'lt2',  name: '855002', icon: '奖池/传说宝具/Property_855002_custom.png', rarity: 'SR' },
  { id: 'lt3',  name: '855003', icon: '奖池/传说宝具/Property_855003_custom.png', rarity: 'SR' },
  { id: 'lt4',  name: '855004', icon: '奖池/传说宝具/Property_855004_custom.png', rarity: 'SR' },
  { id: 'lt5',  name: '855005', icon: '奖池/传说宝具/Property_855005_custom.png', rarity: 'SR' },
  { id: 'lt6',  name: '855006', icon: '奖池/传说宝具/Property_855006_custom.png', rarity: 'SR' },
  { id: 'lt7',  name: '855007', icon: '奖池/传说宝具/Property_855007_custom.png', rarity: 'SR' },
  { id: 'lt8',  name: '855008', icon: '奖池/传说宝具/Property_855008_custom.png', rarity: 'SR' },
  { id: 'lt9',  name: '855009', icon: '奖池/传说宝具/Property_855009_custom.png', rarity: 'SR' },
  { id: 'lt10', name: '855010', icon: '奖池/传说宝具/Property_855010_custom.png', rarity: 'SR' },
  { id: 'lt11', name: '855011', icon: '奖池/传说宝具/Property_855011_custom.png', rarity: 'SR' },
  { id: 'lt12', name: '855012', icon: '奖池/传说宝具/Property_855012_custom.png', rarity: 'SR' },
];

function rollLegendaryTreasure() {
  return { ...LEGENDARY_TREASURE[Math.floor(Math.random() * LEGENDARY_TREASURE.length)] };
}

function openChest(pool, chestIcon) {
  const itemPool = pool || DEEP_SEA_TREASURE;
  return new Promise(resolve => {
    const overlay = document.getElementById('chestOverlay');
    const box = document.getElementById('chestBox');
    overlay.onclick = null; // 清除上一个箱子的点击事件
    overlay.classList.add('show');
    box.innerHTML = `
      <div class="chest-icon" style="background-image:url('${chestIcon || '奖池/JP/Property_GachaChest.png'}')"></div>
      <div class="chest-hint">点击开启</div>
    `;
    let revealed = false;
    box.onclick = function(e) {
      e.stopPropagation();
      if (revealed) return;
      revealed = true;
      const reward = rollFromPool(itemPool);
      box.innerHTML = `
        <div class="chest-reveal">
          <div class="reveal-icon" style="background-image:url('${reward.icon}')"></div>
          <div class="reveal-name">${reward.name}</div>
          ${reward.qty > 1 ? `<div class="reveal-qty">x${reward.qty}</div>` : ''}
          <div class="reveal-continue">点击继续</div>
        </div>
      `;
      overlay.onclick = function() {
        overlay.classList.remove('show');
        resolve(reward);
      };
    };
  });
}

function rollFromPool(pool) {
  const total = pool.reduce((s, i) => s + (i.weight || 1), 0);
  let r = Math.random() * total;
  for (const item of pool) {
    const w = item.weight || 1;
    r -= w;
    if (r <= 0) return { ...item, qty: item.qty || 1 };
  }
  return { ...pool[pool.length - 1], qty: pool[pool.length - 1].qty || 1 };
}

let state = { luck: 0, totalCount: 0, shantong: 0, pityCounter: 0, totalSpent: 0, history: [], historySeq: 0, deepSea: 0, legendary: 0, recentTreasures: {} };

function createItems() {
  const area = document.getElementById('mainArea');
  // 正方形布局: 4行, 中间留给幸运值
  const grid = [
    [0,  1,  2,  3,  4 ],
    [5, -1, -1, -1,  6 ],
    [7, -1, -1, -1,  8 ],
    [9, 10, 11, 12, 13],
  ];
  const cellSize = 84;
  const offsetX = 0;
  const offsetY = 0;

  grid.forEach((row, r) => {
    row.forEach((col, c) => {
      if (col < 0) return;
      const item = ITEMS[col];
      const el = document.createElement('div');
      el.className = `item rarity-${item.rarity}`;
      el.id = `item-${item.id}`;
      el.style.left = (offsetX + c * cellSize) + 'px';
      el.style.top  = (offsetY + r * cellSize) + 'px';
      el.innerHTML = `
        <div class="item-bg"></div>
        <div class="item-frame"></div>
        <img class="icon" src="${item.icon}" alt="${item.name}">
      `;
      el.title = item.name;
      area.appendChild(el);
    });
  });
}

function getTotalWeight() { return ROLL_POOL.reduce((s, i) => s + i.weight, 0); }

function roll() {
  let r = Math.random() * getTotalWeight();
  for (const entry of ROLL_POOL) {
    r -= entry.weight;
    if (r <= 0) {
      const base = ITEMS.find(i => i.id === entry.id);
      return { ...entry, name: base.name, icon: base.icon, rarity: base.rarity };
    }
  }
  const last = ROLL_POOL[ROLL_POOL.length - 1];
  const base = ITEMS.find(i => i.id === last.id);
  return { ...last, name: base.name, icon: base.icon, rarity: base.rarity };
}

function showFloatText(text, x, y) {
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

async function doPull(times) {
  state.totalSpent += times;
  const results = [];

  for (let i = 0; i < times; i++) {
    state.totalCount++;
    state.pityCounter++;

    let got;
    if (state.pityCounter >= 260) {
      got = { ...ITEMS.find(i => i.id === 1), qty: 1 };
      state.pityCounter = 0;
    } else if (state.luck >= 80) {
      got = { ...ITEMS.find(i => i.id === 5), qty: 2 };
      state.luck = 0;
    } else {
      got = { ...roll() };
    }

    state.luck += 1;

    if (got.id === 5) {
      state.shantong += got.qty;
      state.luck = 0;
    }
    if (got.id === 1) state.pityCounter = 0;
    if (got.id === 1) state.deepSea++;
    if (got.id === 14) {
      state.legendary++;
      const lt = rollFromPool(LEGENDARY_TREASURE);
      got = { ...lt };
      addToBackpack(lt);
      renderRecentTreasures();
    }
    results.push(got);
  }

  // 深海珍藏开箱
  for (let i = 0; i < results.length; i++) {
    if (results[i].id === 1) {
      const treasure = await openChest(DEEP_SEA_TREASURE, '奖池/JP/Property_GachaChest.png');
      results[i] = { ...treasure, qty: treasure.qty || 1 };
      addToBackpack(treasure);
      renderRecentTreasures();
    }
  }

  // 记录本次抽卡（上限30条，超出则删除最旧记录）
  state.historySeq++;
  state.history.unshift({
    seq: state.historySeq,
    items: results.map(r => r.id),
    count: times
  });
  state.history = state.history.slice(0, 30);
  renderHistory();

  updateUI();

  showResults(results);
}

function showResults(results) {
  const container = document.getElementById('resultItems');
  container.innerHTML = '';
  results.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = `result-item rarity-${r.rarity}`;
    el.style.animationDelay = `${i * 0.1}s`;
    el.innerHTML = `
      <div class="item-bg"></div>
      <div class="item-frame"></div>
      <img class="icon" src="${r.icon}" alt="${r.name}">
      ${r.qty > 1 ? `<span class="qty">${r.qty}</span>` : ''}
    `;
    el.title = r.name;
    container.appendChild(el);
  });
  document.getElementById('resultOverlay').classList.add('show');
}

function closeResult(e) {
  if (e && e.target !== e.currentTarget && !e.target.classList.contains('result-close')) return;
  document.getElementById('resultOverlay').classList.remove('show');
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const allItems = [...ITEMS, ...DEEP_SEA_TREASURE, ...LEGENDARY_TREASURE];
  list.innerHTML = state.history.map((e, i) => {
    const imgs = e.items.map(id => {
      const item = allItems.find(i => i.id === id);
      return item ? `<img src="${item.icon}" title="${item.name}">` : '';
    }).join('');
    return `<div class="history-entry"><span class="h-time">第${e.seq}次</span><div class="h-items">${imgs}</div></div>`;
  }).join('');
}

function updateUI() {
  document.getElementById('luckNumber').textContent = state.luck;
  document.getElementById('totalSpent').textContent = state.totalSpent;
  document.getElementById('shantongCount').textContent = state.shantong;
  document.getElementById('deepSeaCount').textContent = state.deepSea;
  document.getElementById('legendaryCount').textContent = state.legendary;
  document.getElementById('pityText').textContent = `${260 - state.pityCounter}次寻宝必得深海珍藏`;
}

function renderProbabilities() {
  const list = document.getElementById('probList');
  const total = ROLL_POOL.reduce((s, i) => s + i.weight, 0);
  const groups = {};
  ROLL_POOL.forEach(e => {
    if (!groups[e.id]) groups[e.id] = [];
    groups[e.id].push(e);
  });
  const sorted = Object.entries(groups).map(([id, entries]) => {
    const item = ITEMS.find(i => i.id === +id);
    const name = item ? item.name : id;
    const totalPct = entries.reduce((s, e) => s + e.weight, 0) / total * 100;
    let subs = '';
    if (entries.length > 1) {
      subs = entries.map(e =>
        `<div class="prob-sub">x${e.qty} ${(e.weight/total*100).toFixed(2)}%</div>`
      ).join('');
    } else if (+id === 1) {
      subs = `<div class="prob-sub">UP宝具 0.0833% × 3</div><div class="prob-sub">专属宝具 0.0139% × 18</div>`;
    }
    return { name, totalPct, html: `<div class="prob-group">
      <div class="prob-group-name"><span>${name}</span><span class="prob-pct">${totalPct.toFixed(2)}%</span></div>
      ${subs}
    </div>` };
  }).sort((a, b) => a.totalPct - b.totalPct).map(o => o.html).join('');
  list.innerHTML = sorted;
}

function addToBackpack(item) {
  const key = item.icon;
  if (state.recentTreasures[key]) {
    state.recentTreasures[key].count++;
  } else {
    state.recentTreasures[key] = { icon: item.icon, name: item.name, count: 1 };
  }
}

function renderRecentTreasures() {
  const container = document.getElementById('deepSeaItems');
  container.innerHTML = Object.values(state.recentTreasures).map(t =>
    `<div class="backpack-item"><img src="${t.icon}" title="${t.name}">${t.count > 1 ? `<span class="backpack-count">${t.count}</span>` : ''}</div>`
  ).join('');
}

createItems();
renderProbabilities();
renderRecentTreasures();
updateUI();
</script>
